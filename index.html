<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中国語フラッシュカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef0f4;
    --bg-grid: #e3e6ed;
    --ink: #1c1f26;
    --ink-soft: #5b6270;
    --ink-faint: #9aa0ad;
    --card-front: #ffffff;
    --card-back: #fbfaf7;
    --accent: #3d4eb0;
    --accent-soft: #e7e9fb;
    --good: #1f9d6c;
    --good-soft: #e3f6ee;
    --bad: #c0392b;
    --bad-soft: #fbe9e6;
    --shadow-lg: 0 24px 48px -16px rgba(28,31,38,0.22), 0 2px 6px rgba(28,31,38,0.06);
    --shadow-sm: 0 8px 20px -8px rgba(28,31,38,0.18);
    --radius: 1.5rem;
    --font-ui: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, -apple-system, sans-serif;
    --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", var(--font-ui);
    --font-jp: "Noto Sans JP", var(--font-ui);
    --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(61,78,176,0.06), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(192,57,43,0.05), transparent 40%),
      var(--bg);
    font-family: var(--font-ui);
    color: var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }

  .app{
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1rem, 5vw, 2rem) 2.5rem;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- progress ---------- */
  .progress-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:.5rem;
    margin-bottom: clamp(1.5rem, 5vw, 3rem);
  }
  .progress-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .progress-eyebrow{
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--ink-faint);
    font-weight:600;
  }
  .progress-text{
    font-family: var(--font-mono);
    font-size: .95rem;
    font-weight:600;
    color: var(--ink-soft);
    letter-spacing: .02em;
  }
  .progress-track{
    width:100%;
    height:6px;
    border-radius:99px;
    background: var(--bg-grid);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    background: linear-gradient(90deg, var(--accent), #6f7cd1);
    transition: width .45s cubic-bezier(.4,.2,.2,1);
  }

  /* ---------- game screen ---------- */
  .stage{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
  }

  .judge-row{
    display:flex;
    gap: clamp(1.5rem, 6vw, 2.75rem);
    margin-bottom: 1.25rem;
    opacity:0;
    visibility:hidden;
    transform: translateY(6px);
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease, visibility .25s;
  }
  .judge-row.active{
    opacity:1;
    visibility:visible;
    transform: translateY(0);
    pointer-events:auto;
  }
  .judge-btn{
    width: 64px;
    height: 64px;
    border-radius:50%;
    border: 2px solid transparent;
    font-size: 1.5rem;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: var(--shadow-sm);
  }
  .judge-btn:hover{ transform: translateY(-3px); }
  .judge-btn:active{ transform: translateY(0) scale(.96); }
  .judge-btn.wrong{ background: var(--bad-soft); color: var(--bad); }
  .judge-btn.correct{ background: var(--good-soft); color: var(--good); }

  .card-wrap{
    width: min(92vw, 380px);
    aspect-ratio: 3 / 4;
    perspective: 1600px;
    margin-bottom: clamp(1.5rem, 5vw, 2.5rem);
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.4,.2,.2,1);
    border-radius: var(--radius);
  }
  .card:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
  .card.flipped{ transform: rotateY(180deg); }

  .card-face{
    position:absolute;
    inset:0;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 2rem 1.5rem;
    box-shadow: var(--shadow-lg);
  }

  .card-front{ background: var(--card-front); }
  .word{
    font-family: var(--font-zh);
    font-weight:800;
    font-size: clamp(2.1rem, 9vw, 3rem);
    color: var(--ink);
    line-height:1.25;
    word-break: keep-all;
  }
  .hint{
    margin-top:1.75rem;
    font-size:.78rem;
    color: var(--ink-faint);
    letter-spacing:.05em;
  }

  .card-back{
    background: var(--card-back);
    transform: rotateY(180deg);
    border: 1px solid rgba(28,31,38,0.05);
  }
  .word-mini{
    font-family: var(--font-zh);
    font-weight:700;
    font-size: 1.05rem;
    color: var(--ink-faint);
    margin-bottom: 1.1rem;
  }
  .pinyin{
    font-family: var(--font-mono);
    font-size: .95rem;
    font-weight:600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: .35rem .85rem;
    border-radius: 99px;
    letter-spacing:.03em;
    margin-bottom: 1.4rem;
  }
  .meaning{
    font-family: var(--font-jp);
    font-size: clamp(1.05rem, 4.5vw, 1.25rem);
    font-weight:500;
    color: var(--ink);
    line-height:1.7;
    max-width: 90%;
  }

  .back-btn{
    border:none;
    background:none;
    font-family: var(--font-ui);
    font-size:.92rem;
    font-weight:600;
    color: var(--ink-soft);
    padding: .7rem 1.2rem;
    border-radius: 99px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  .back-btn:not(:disabled):hover{ background: var(--bg-grid); color: var(--ink); }
  .back-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---------- result screen ---------- */
  .result-screen{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top: clamp(1.5rem, 8vw, 3rem);
  }
  .result-eyebrow{
    font-size:.74rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color: var(--accent);
    font-weight:700;
    margin-bottom:.6rem;
  }
  .result-screen h1{
    font-family: var(--font-jp);
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    margin: 0 0 .5rem;
  }
  .result-summary{
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0 0 1.75rem;
  }
  .result-summary strong{ color: var(--ink); font-weight:700; }

  .missed-list{
    list-style:none;
    margin:0 0 1.75rem;
    padding:0;
    width:100%;
    max-height: 260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:.5rem;
  }
  .missed-list li{
    display:flex;
    align-items:baseline;
    gap:.6rem;
    background:#fff;
    border-radius: .9rem;
    padding:.7rem .9rem;
    box-shadow: var(--shadow-sm);
    text-align:left;
  }
  .missed-word{ font-family: var(--font-zh); font-weight:700; font-size:1.05rem; flex-shrink:0; }
  .missed-pinyin{ font-family: var(--font-mono); font-size:.78rem; color: var(--accent); flex-shrink:0; }
  .missed-meaning{ font-family: var(--font-jp); font-size:.85rem; color: var(--ink-soft); }

  .download-note{
    font-size:.85rem;
    color: var(--good);
    background: var(--good-soft);
    border-radius: 99px;
    padding:.5rem 1.1rem;
    margin: 0 0 1.5rem;
  }

  .retry-btn{
    border:none;
    background: var(--accent);
    color:#fff;
    font-family: var(--font-ui);
    font-weight:700;
    font-size: 1rem;
    padding: .9rem 1.8rem;
    border-radius: 99px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .retry-btn:hover{ transform: translateY(-2px); }
  .retry-btn:active{ transform: translateY(0); }

  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .card, .judge-row, .progress-fill, .retry-btn, .judge-btn, .back-btn{ transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app">

    <header class="progress-wrap">
      <div class="progress-top">
        <span class="progress-eyebrow">学習進行</span>
        <span class="progress-text" id="progressText">0 / 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </header>

    <main class="stage" id="gameScreen">

      <div class="judge-row" id="judgeRow">
        <button class="judge-btn wrong" id="btnWrong" aria-label="間違えた">✕</button>
        <button class="judge-btn correct" id="btnCorrect" aria-label="正解">◯</button>
      </div>

      <div class="card-wrap">
        <div class="card" id="card" tabindex="0" role="button" aria-label="カードをめくる">
          <div class="card-face card-front">
            <span class="word" id="wordFront"></span>
            <span class="hint">タップして答えを見る</span>
          </div>
          <div class="card-face card-back">
            <span class="word-mini" id="wordBack"></span>
            <span class="pinyin" id="pinyinBack"></span>
            <span class="meaning" id="meaningBack"></span>
          </div>
        </div>
      </div>

      <button class="back-btn" id="backBtn" disabled>← 前の単語に戻る</button>

    </main>

    <section class="result-screen" id="resultScreen" hidden>
      <span class="result-eyebrow">Session Complete</span>
      <h1>学習完了</h1>
      <p class="result-summary" id="resultSummary"></p>
      <ul class="missed-list" id="missedList"></ul>
      <p class="download-note" id="downloadNote" hidden>苦手単語だけのファイル（revised_flashcards.html）をダウンロードしました。</p>
      <button class="retry-btn" id="retryBtn">✕の単語だけで再挑戦</button>
    </section>

  </div>

<script>
(function(){

  const masterVocabulary = [
    { word: "毫不犹豫", pinyin: "háo bù yóu yù", meaning: "少しも躊躇しない、迷わずきっぱりと" },
    { word: "无厘头", pinyin: "wú lí tóu", meaning: "わけがわからない、ナンセンスな" },
    { word: "一拍即合", pinyin: "yī pāi jí hé", meaning: "すぐに意気投合する、話がすぐにまとまる" },
    { word: "提示词", pinyin: "tí shì cí", meaning: "プロンプト（AIへの指示語句）" },
    { word: "随机", pinyin: "suí jī", meaning: "ランダムである、状況に応じる" },
    { word: "一败涂地", pinyin: "yī bài tú dì", meaning: "完敗する、無残に敗北する" },
    { word: "弊端", pinyin: "bì duān", meaning: "弊害、欠陥、デメリット" },
    { word: "遗迹", pinyin: "yí jì", meaning: "遺跡、名残" },
    { word: "说到底", pinyin: "shuō dào dǐ", meaning: "結局のところ、突き詰めると" },
    { word: "离谱", pinyin: "lí pǔ", meaning: "常識外れである、度が過ぎている、話がそれる" },
    { word: "映射", pinyin: "yìng shè", meaning: "マッピングする、反映する、投影する" },
    { word: "预判", pinyin: "yù pàn", meaning: "予測、見通し" },
    { word: "痛点", pinyin: "tòng diǎn", meaning: "ビジネスや技術における「最大の課題」" },
    { word: "畅想", pinyin: "chàng xiǎng", meaning: "自由に想像を膨らませる、のびのびと想う" },
    { word: "实操", pinyin: "shí cāo", meaning: "実践的な操作、実務、実際の運用" },
    { word: "端详", pinyin: "duān xiáng", meaning: "じっくり観察する、熟視する" },
    { word: "蜕变", pinyin: "tuì biàn", meaning: "脱皮する、変貌を遂げる" },
    { word: "近在咫尺", pinyin: "jìn zài zhǐ chǐ", meaning: "極めて近くにある" }
  ]; // END_MASTER_VOCABULARY

  // ---------------- state ----------------
  let deckOrder = [];
  let currentStep = 0;
  let history = [];      // stack of judged step indices
  let results = {};       // step index -> 'correct' | 'wrong'
  let isFlipped = false;
  let lastWrongItems = [];

  const $ = id => document.getElementById(id);
  const card = $('card');
  const judgeRow = $('judgeRow');
  const backBtn = $('backBtn');
  const gameScreen = $('gameScreen');
  const resultScreen = $('resultScreen');

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startSession(source){
    deckOrder = shuffle(source);
    currentStep = 0;
    history = [];
    results = {};
    isFlipped = false;

    resultScreen.hidden = true;
    gameScreen.style.display = '';
    card.classList.remove('flipped');
    judgeRow.classList.remove('active');

    renderCard();
  }

  function renderCard(){
    const item = deckOrder[currentStep];
    $('wordFront').textContent = item.word;
    $('wordBack').textContent = item.word;
    $('pinyinBack').textContent = item.pinyin;
    $('meaningBack').textContent = item.meaning;

    isFlipped = false;
    card.classList.remove('flipped');
    judgeRow.classList.remove('active');

    updateProgress();
    backBtn.disabled = history.length === 0;
  }

  function updateProgress(){
    $('progressText').textContent = (currentStep + 1) + ' / ' + deckOrder.length;
    $('progressFill').style.width = ((currentStep / deckOrder.length) * 100) + '%';
  }

  function setFlipped(flip){
    isFlipped = flip;
    card.classList.toggle('flipped', flip);
    judgeRow.classList.toggle('active', flip);
  }

  card.addEventListener('click', () => setFlipped(!isFlipped));
  card.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      setFlipped(!isFlipped);
    }
  });

  function judge(result){
    results[currentStep] = result;
    history.push(currentStep);
    currentStep++;

    if(currentStep >= deckOrder.length){
      showResults();
    } else {
      renderCard();
    }
  }

  $('btnWrong').addEventListener('click', (e) => { e.stopPropagation(); judge('wrong'); });
  $('btnCorrect').addEventListener('click', (e) => { e.stopPropagation(); judge('correct'); });

  backBtn.addEventListener('click', () => {
    if(history.length === 0) return;
    currentStep = history.pop();
    renderCard();
  });

  function showResults(){
    gameScreen.style.display = 'none';
    resultScreen.hidden = false;

    const wrongItems = deckOrder.filter((item, idx) => results[idx] === 'wrong');
    const total = deckOrder.length;
    lastWrongItems = wrongItems;

    $('resultSummary').innerHTML =
      '間違えた単語: <strong>' + wrongItems.length + '語</strong> / 総数 <strong>' + total + '語</strong>';

    const list = $('missedList');
    list.innerHTML = '';
    wrongItems.forEach(item => {
      const li = document.createElement('li');
      const w = document.createElement('span');
      w.className = 'missed-word';
      w.textContent = item.word;
      const p = document.createElement('span');
      p.className = 'missed-pinyin';
      p.textContent = item.pinyin;
      const m = document.createElement('span');
      m.className = 'missed-meaning';
      m.textContent = item.meaning;
      li.append(w, p, m);
      list.appendChild(li);
    });

    if(wrongItems.length > 0){
      downloadRevisedHTML(wrongItems);
      $('downloadNote').hidden = false;
    } else {
      $('downloadNote').hidden = true;
    }
  }

  $('retryBtn').addEventListener('click', () => {
    startSession(lastWrongItems.length > 0 ? lastWrongItems : masterVocabulary);
  });

  function downloadRevisedHTML(wrongItems){
    try{
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const newVocabJSON = JSON.stringify(wrongItems, null, 2);
      const pattern = /const masterVocabulary = \[[\s\S]*?\];\s*\/\/ END_MASTER_VOCABULARY/;
      const replacement = 'const masterVocabulary = ' + newVocabJSON + '; // END_MASTER_VOCABULARY';
      const newHtml = fullHtml.replace(pattern, replacement);

      const blob = new Blob([newHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'revised_flashcards.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch(err){
      console.error('復習用ファイルの生成に失敗しました', err);
    }
  }

  startSession(masterVocabulary);

})();
</script>
</body>
</html>
