<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語フラッシュカード</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f5;
    --card-bg: #ffffff;
    --card-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    --text-primary: #1a1a2e;
    --text-secondary: #5a6a85;
    --text-pinyin: #3d6b9a;
    --accent: #4f6ef7;
    --correct: #22a06b;
    --correct-light: #e3f9f0;
    --wrong: #e5484d;
    --wrong-light: #ffeef0;
    --border: #dde2ec;
    --btn-bg: #ffffff;
    --progress-track: #dde2ec;
    --progress-fill: #4f6ef7;
    --result-bg: #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  /* ── Header ── */
  .header {
    width: 100%;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .progress-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }

  .progress-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .progress-bar {
    width: 120px;
    height: 4px;
    background: var(--progress-track);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--progress-fill);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ── Main area ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 16px 10px 16px;
    gap: 14px;
  }

  /* ── Judge buttons row (above card) ── */
  .judge-row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 640px;
  }

  .judge-btn {
    flex: 1;
    height: 56px;
    border-radius: 14px;
    border: none;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.25s;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    letter-spacing: 0.02em;
  }

  .judge-btn .btn-label {
    font-size: 14px;
    font-weight: 600;
  }

  .judge-btn:disabled {
    opacity: 0.25;
    pointer-events: none;
  }

  .btn-wrong {
    background: var(--wrong-light);
    color: var(--wrong);
  }

  .btn-correct {
    background: var(--correct-light);
    color: var(--correct);
  }

  .judge-btn:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.14);
  }

  .judge-btn:not(:disabled):active {
    transform: scale(0.97);
  }

  /* ── Card scene (3D flip) ── */
  .scene {
    width: 100%;
    max-width: 640px;
    height: 380px;
    perspective: 1000px;
    cursor: pointer;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--card-shadow);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    user-select: none;
  }

  .card-back {
    transform: rotateY(180deg);
  }

  .card-hint {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: 0.5;
    position: absolute;
    bottom: 16px;
    right: 20px;
  }

  .word-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    margin-bottom: 16px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .word-text {
    font-size: clamp(44px, 11vw, 72px);
    font-weight: 700;
    color: var(--text-primary);
    text-align: center;
    line-height: 1.15;
    letter-spacing: 0.04em;
  }

  .pinyin-text {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 500;
    color: var(--text-pinyin);
    margin-bottom: 20px;
    letter-spacing: 0.05em;
    text-align: center;
  }

  .meaning-text {
    font-size: clamp(15px, 4vw, 18px);
    color: var(--text-primary);
    text-align: center;
    line-height: 1.7;
    max-width: 460px;
  }

  /* ── Footer / back button ── */
  .footer {
    padding: 0 10px 28px;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .back-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 24px;
    border-radius: 99px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .back-btn:hover:not(:disabled) {
    background: #f5f7ff;
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(79,110,247,0.12);
  }

  .back-btn:disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  /* ── Result screen ── */
  .result-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    padding: 40px 16px;
    gap: 28px;
  }

  .result-card {
    background: var(--result-bg);
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    padding: 44px 32px;
    max-width: 460px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }

  .result-emoji { font-size: 54px; margin-bottom: 6px; }

  .result-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .result-stats {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .result-score-row {
    display: flex;
    gap: 14px;
    margin: 10px 0;
  }

  .score-pill {
    padding: 10px 22px;
    border-radius: 99px;
    font-size: 15px;
    font-weight: 600;
  }

  .score-correct { background: var(--correct-light); color: var(--correct); }
  .score-wrong   { background: var(--wrong-light);   color: var(--wrong);   }

  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 11px;
    width: 100%;
    max-width: 300px;
    margin-top: 6px;
  }

  .result-btn {
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }

  .result-btn:hover  { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.11); }
  .result-btn:active { transform: scale(0.98); }

  .btn-primary-action   { background: var(--accent); color: #fff; }
  .btn-secondary-action { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-primary); }

  .download-notice {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: -4px;
    opacity: 0.65;
  }

  @media (max-width: 400px) {
    .scene { height: 330px; }
    .judge-btn { height: 52px; font-size: 20px; }
    .result-card { padding: 32px 20px; }
  }
</style>
</head>
<body>

<div id="study-screen" style="display:flex; flex-direction:column; align-items:center; width:100%; min-height:100vh;">

  <header class="header">
    <span class="header-title">単語フラッシュカード</span>
    <div class="progress-block">
      <span class="progress-label" id="progress-label">1 / 46</span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </header>

  <main class="main">

    <!-- ◯✕ buttons ABOVE the card -->
    <div class="judge-row">
      <button class="judge-btn btn-wrong"   id="btn-wrong"   disabled aria-label="間違えた">
        ✕ <span class="btn-label">間違えた</span>
      </button>
      <button class="judge-btn btn-correct" id="btn-correct" disabled aria-label="正解">
        ○ <span class="btn-label">正解</span>
      </button>
    </div>

    <!-- Card -->
    <div class="scene" id="card-scene" role="button" aria-label="カードをクリックして答えを見る" tabindex="0">
      <div class="card-inner" id="card-inner">
        <div class="card-face card-front">
          <span class="word-label">単語</span>
          <span class="word-text" id="card-word">棄兒</span>
          <span class="card-hint">タップして確認</span>
        </div>
        <div class="card-face card-back">
          <span class="pinyin-text" id="card-pinyin">qì ér</span>
          <span class="meaning-text" id="card-meaning">捨て子転じて、見捨てられた存在、厄介者。</span>
        </div>
      </div>
    </div>

  </main>

  <footer class="footer">
    <button class="back-btn" id="btn-back" disabled>← 前の単語に戻る</button>
  </footer>
</div>

<!-- Result screen -->
<div id="result-screen" class="result-screen">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-title">セッション完了！</div>
    <div class="result-stats" id="result-stats">全単語の学習が終わりました</div>
    <div class="result-score-row">
      <span class="score-pill score-correct" id="score-correct">○ 0語</span>
      <span class="score-pill score-wrong"   id="score-wrong">✕ 0語</span>
    </div>
    <div class="result-actions">
      <button class="result-btn btn-primary-action"   id="btn-retry">✕の単語だけで再挑戦</button>
      <p class="download-notice" id="download-notice" style="display:none">（間違えた単語のHTMLを自動ダウンロード）</p>
      <button class="result-btn btn-secondary-action" id="btn-reset">最初からやり直す</button>
    </div>
  </div>
</div>

<script>
const masterVocabulary = [
  { word: "裂痕", pinyin: "liè hén", meaning: "亀裂、仲たがい" },
  { word: "碎裂", pinyin: "suì liè", meaning: "砕け散る、ばらばらに割れる" },
  { word: "荷包", pinyin: "hé bāo", meaning: "財布、懐（元々は巾着袋のこと）。" },
  { word: "作妖", pinyin: "zuò yāo", meaning: "ややこしい問題を起こす、突飛な行動で引っかき回す" },
  { word: "错综复杂", pinyin: "cuò zōng fù zá", meaning: "複雑に入り組んでいる" },
  { word: "情资", pinyin: "qíng zī", meaning: "情報、インテリジェンス" },
  { word: "潜伏", pinyin: "qián fú", meaning: "潜伏する、潜り込む。" },
  { word: "八卦", pinyin: "bā guà", meaning: "ゴシップ、噂話、スキャンダル" },
  { word: "同穿一件裤子", pinyin: "tóng chuān yī jiàn kù zi", meaning: "ぐるになる、一心同体である、非常に親しい間柄" },
  { word: "味道", pinyin: "wèi dào", meaning: "ニュアンス、雰囲気。" },
  { word: "诓", pinyin: "kuāng", meaning: "騙す、担ぐ" },
  { word: "软柿子", pinyin: "ruǎn shì zi", meaning: "扱いやすい人、弱い相手" },
  { word: "搞定", pinyin: "gǎo dìng", meaning: "解決する、片付ける" },
  { word: "说了算", pinyin: "shuō le suàn", meaning: "決定権を持つ、支配する、牛耳る" },
  { word: "垫高", pinyin: "diàn gāo", meaning: "底上げされる、積み上がって高くなる" },
  { word: "好威", pinyin: "hǎo wēi", meaning: "とても威風堂々としている、かっこいい" },
  { word: "住手", pinyin: "zhù shǒu", meaning: "手を止める、やめる" },
  { word: "深仇大恨", pinyin: "shēn chóu dà hèn", meaning: "深い恨み、根深い怨恨（四字熟語）" },
  { word: "赶尽杀绝", pinyin: "gǎn jìn shā jué", meaning: "根絶やしにする、一人残らず抹殺する" },
  { word: "可恶", pinyin: "kě wù", meaning: "憎らしい、けしからん" },
  { word: "广泛", pinyin: "guǎng fàn", meaning: "広範囲に、広く" },
  { word: "爆粗口", pinyin: "bào cū kǒu", meaning: "汚い言葉を使う" },
  { word: "拖下水", pinyin: "tuō xià shuǐ", meaning: "泥沼に引きずり込む、巻き添えにする" },
  { word: "冗长", pinyin: "rǒng cháng", meaning: "長たらしい、無駄に長い" },
  { word: "谈拢", pinyin: "tán lǒng", meaning: "話がまとまる、合意に達する" },
  { word: "一环扣一环", pinyin: "yī huán kòu yī huán", meaning: "次から次へと緊密に連動している" },
  { word: "紧咬不放", pinyin: "jǐn yǎo bù fàng", meaning: "執拗にしがみつく、譲歩しない。" },
  { word: "焦灼", pinyin: "jiāo zhuó", meaning: "膠着している、一進一退の緊迫した状態" },
  { word: "底定", pinyin: "dǐ dìng", meaning: "定まる、落ち着く、大局が決まる" }
];

// ── State ──
let deck = [], currentIndex = 0, results = {}, history = [], isFlipped = false;

// ── DOM refs ──
const cardInner   = document.getElementById('card-inner');
const cardWord    = document.getElementById('card-word');
const cardPinyin  = document.getElementById('card-pinyin');
const cardMeaning = document.getElementById('card-meaning');
const btnWrong    = document.getElementById('btn-wrong');
const btnCorrect  = document.getElementById('btn-correct');
const btnBack     = document.getElementById('btn-back');
const progressLabel = document.getElementById('progress-label');
const progressFill  = document.getElementById('progress-fill');
const studyScreen   = document.getElementById('study-screen');
const resultScreen  = document.getElementById('result-screen');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSession(vocab) {
  deck = shuffle(vocab);
  currentIndex = 0; results = {}; history = []; isFlipped = false;
  cardInner.classList.remove('flipped');
  showCard(0);
  studyScreen.style.display = 'flex';
  resultScreen.style.display = 'none';
}

function showCard(idx) {
  const item = deck[idx];
  cardWord.textContent    = item.word;
  cardPinyin.textContent  = item.pinyin;
  cardMeaning.textContent = item.meaning;
  updateProgress(idx);
  setFlipped(false);
}

function setFlipped(f) {
  isFlipped = f;
  if (f) {
    cardInner.classList.add('flipped');
    btnWrong.disabled   = false;
    btnCorrect.disabled = false;
  } else {
    cardInner.classList.remove('flipped');
    btnWrong.disabled   = true;
    btnCorrect.disabled = true;
  }
  btnBack.disabled = history.length === 0;
}

function updateProgress(idx) {
  const total = deck.length, pct = total > 0 ? Math.round((idx / total) * 100) : 0;
  progressLabel.textContent = `${idx + 1} / ${total}`;
  progressFill.style.width  = pct + '%';
}

document.getElementById('card-scene').addEventListener('click', () => { if (!isFlipped) setFlipped(true); });
document.getElementById('card-scene').addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!isFlipped) setFlipped(true); }
});

function judge(verdict) {
  results[deck[currentIndex].word] = verdict;
  history.push(currentIndex);
  const next = currentIndex + 1;
  if (next >= deck.length) { showResult(); return; }
  currentIndex = next;
  cardInner.classList.remove('flipped');
  setTimeout(() => showCard(currentIndex), 280);
}

btnWrong.addEventListener('click',   () => judge('wrong'));
btnCorrect.addEventListener('click', () => judge('correct'));

btnBack.addEventListener('click', () => {
  if (history.length === 0) return;
  const prev = history.pop();
  delete results[deck[prev].word];
  currentIndex = prev;
  cardInner.classList.remove('flipped');
  setTimeout(() => showCard(currentIndex), 100);
});

function showResult() {
  studyScreen.style.display = 'none';
  resultScreen.style.display = 'flex';
  const total     = deck.length;
  const wrongList = deck.filter(item => results[item.word] === 'wrong');
  const wc = wrongList.length, cc = total - wc;
  document.getElementById('result-emoji').textContent    = wc === 0 ? '🏆' : wc < total / 2 ? '🎉' : '📖';
  document.getElementById('result-stats').textContent    = `${total}語の学習が完了しました`;
  document.getElementById('score-correct').textContent   = `○ ${cc}語`;
  document.getElementById('score-wrong').textContent     = `✕ ${wc}語`;
  const notice = document.getElementById('download-notice');
  if (wc > 0) { notice.style.display = 'block'; downloadRevisedHTML(wrongList); }
  else { notice.style.display = 'none'; }
}

document.getElementById('btn-retry').addEventListener('click', () => {
  const w = deck.filter(item => results[item.word] === 'wrong');
  startSession(w.length > 0 ? w : masterVocabulary);
});
document.getElementById('btn-reset').addEventListener('click', () => startSession(masterVocabulary));

function downloadRevisedHTML(wrongList) {
  const escaped = JSON.stringify(wrongList, null, 2)
    .replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');

  const src = `<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦手単語フラッシュカード</title>

.judge-btn{flex:1;height:56px;border-radius:14px;border:none;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.15s,box-shadow 0.15s,opacity 0.25s;box-shadow:0 3px 10px rgba(0,0,0,0.10);}
.judge-btn .btn-label{font-size:14px;font-weight:600;}

.btn-wrong{background:var(--wrong-light);color:var(--wrong);}

.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.4,0.2,0.2,1);}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;background:var(--card-bg);border-radius:20px;box-shadow:var(--card-shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;user-select:none;}
.card-back{transform:rotateY(180deg);}
.card-hint{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-secondary);opacity:0.5;position:absolute;bottom:16px;right:20px;}
.badge{background:var(--wrong-light);color:var(--wrong);font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:0.05em;text-transform:uppercase;position:absolute;top:14px;left:18px;}
.word-label{font-size:12px;font-weight:500;color:var(--text-secondary);letter-spacing:0.1em;margin-bottom:16px;text-transform:uppercase;opacity:0.7;}
.word-text{font-size:clamp(44px,11vw,72px);font-weight:700;color:var(--text-primary);text-align:center;line-height:1.15;letter-spacing:0.04em;}
.pinyin-text{font-size:clamp(20px,5vw,26px);font-weight:500;color:var(--text-pinyin);margin-bottom:20px;letter-spacing:0.05em;text-align:center;}
.meaning-text{font-size:clamp(15px,4vw,18px);color:var(--text-primary);text-align:center;line-height:1.7;max-width:460px;}
.footer{padding:0 10px 28px;display:flex;justify-content:center;width:100%;}
.back-btn{background:var(--btn-bg);border:1px solid var(--border);color:var(--text-secondary);font-size:14px;font-weight:500;padding:10px 24px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.back-btn:hover:not(:disabled){background:#f5f7ff;border-color:var(--accent);color:var(--accent);}
.back-btn:disabled{opacity:0.32;cursor:not-allowed;}
.result-screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:100vh;padding:40px 16px;gap:28px;}
.result-card{background:#fff;border-radius:24px;box-shadow:var(--card-shadow);padding:44px 32px;max-width:460px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
.result-emoji{font-size:54px;margin-bottom:6px;}
.result-title{font-size:22px;font-weight:700;color:var(--text-primary);}
.result-stats{font-size:15px;color:var(--text-secondary);line-height:1.7;}
.result-score-row{display:flex;gap:14px;margin:10px 0;}
.score-pill{padding:10px 22px;border-radius:99px;font-size:15px;font-weight:600;}
.score-correct{background:var(--correct-light);color:var(--correct);}
.score-wrong{background:var(--wrong-light);color:var(--wrong);}
.result-actions{display:flex;flex-direction:column;gap:11px;width:100%;max-width:300px;margin-top:6px;}
.result-btn{width:100%;padding:14px 20px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:transform 0.1s,box-shadow 0.15s;}
.result-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.11);}
.result-btn:active{transform:scale(0.98);}
.btn-primary-action{background:var(--accent);color:#fff;}
.btn-secondary-action{background:var(--btn-bg);border:1px solid var(--border);color:var(--text-primary);}
@media(max-width:400px){.scene{height:330px;}.judge-btn{height:52px;font-size:20px;}.result-card{padding:32px 20px;}}
</style>
</head>
<body>
<div id="study-screen" style="display:flex;flex-direction:column;align-items:center;width:100%;min-height:100vh;">
  <header class="header">
    <span class="header-title">苦手単語 復習モード</span>
    <div class="progress-block">
      <span class="progress-label" id="progress-label">1 / ?</span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </header>
  <main class="main">
    <div class="judge-row">
      <button class="judge-btn btn-wrong" id="btn-wrong" disabled aria-label="間違えた">✕ <span class="btn-label">間違えた</span></button>
      <button class="judge-btn btn-correct" id="btn-correct" disabled aria-label="正解">○ <span class="btn-label">正解</span></button>
    </div>
    <div class="scene" id="card-scene" role="button" aria-label="カードをクリックして答えを見る" tabindex="0">
      <div class="card-inner" id="card-inner">
        <div class="card-face card-front">
          <span class="badge">苦手</span>
          <span class="word-label">単語</span>
          <span class="word-text" id="card-word"></span>
          <span class="card-hint">タップして確認</span>
        </div>
        <div class="card-face card-back">
          <span class="pinyin-text" id="card-pinyin"></span>
          <span class="meaning-text" id="card-meaning"></span>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer">
    <button class="back-btn" id="btn-back" disabled>← 前の単語に戻る</button>
  </footer>
</div>
<div id="result-screen" class="result-screen">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="result-title">復習完了！</div>
    <div class="result-stats" id="result-stats"></div>
    <div class="result-score-row">
      <span class="score-pill score-correct" id="score-correct">○ 0語</span>
      <span class="score-pill score-wrong" id="score-wrong">✕ 0語</span>
    </div>
    <div class="result-actions">
      <button class="result-btn btn-primary-action" id="btn-retry">✕の単語だけで再挑戦</button>
      <button class="result-btn btn-secondary-action" id="btn-reset">最初からやり直す</button>
    </div>
  </div>
</div>
<script>
const masterVocabulary=${escaped};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=[],currentIndex=0,results={},history=[],isFlipped=false;
const cardInner=document.getElementById('card-inner'),cardWord=document.getElementById('card-word'),cardPinyin=document.getElementById('card-pinyin'),cardMeaning=document.getElementById('card-meaning'),btnWrong=document.getElementById('btn-wrong'),btnCorrect=document.getElementById('btn-correct'),btnBack=document.getElementById('btn-back'),progressLabel=document.getElementById('progress-label'),progressFill=document.getElementById('progress-fill'),studyScreen=document.getElementById('study-screen'),resultScreen=document.getElementById('result-screen');
function startSession(vocab){deck=shuffle(vocab);currentIndex=0;results={};history=[];isFlipped=false;cardInner.classList.remove('flipped');showCard(0);studyScreen.style.display='flex';resultScreen.style.display='none';}
function showCard(idx){const item=deck[idx];cardWord.textContent=item.word;cardPinyin.textContent=item.pinyin;cardMeaning.textContent=item.meaning;updateProgress(idx);setFlipped(false);}
function setFlipped(f){isFlipped=f;if(f){cardInner.classList.add('flipped');btnWrong.disabled=false;btnCorrect.disabled=false;}else{cardInner.classList.remove('flipped');btnWrong.disabled=true;btnCorrect.disabled=true;}btnBack.disabled=history.length===0;}
function updateProgress(idx){const total=deck.length,pct=total>0?Math.round((idx/total)*100):0;progressLabel.textContent=\`\${idx+1} / \${total}\`;progressFill.style.width=pct+'%';}
document.getElementById('card-scene').addEventListener('click',()=>{if(!isFlipped)setFlipped(true);});
document.getElementById('card-scene').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!isFlipped)setFlipped(true);}});
function judge(verdict){results[deck[currentIndex].word]=verdict;history.push(currentIndex);const next=currentIndex+1;if(next>=deck.length){showResult();return;}currentIndex=next;cardInner.classList.remove('flipped');setTimeout(()=>showCard(currentIndex),280);}
btnWrong.addEventListener('click',()=>judge('wrong'));
btnCorrect.addEventListener('click',()=>judge('correct'));
btnBack.addEventListener('click',()=>{if(history.length===0)return;const prev=history.pop();delete results[deck[prev].word];currentIndex=prev;cardInner.classList.remove('flipped');setTimeout(()=>showCard(currentIndex),100);});
function showResult(){studyScreen.style.display='none';resultScreen.style.display='flex';const total=deck.length,wrongList=deck.filter(item=>results[item.word]==='wrong'),wc=wrongList.length,cc=total-wc;document.getElementById('result-emoji').textContent=wc===0?'🏆':wc<total/2?'🎉':'📖';document.getElementById('result-stats').textContent=\`\${total}語の学習が完了しました\`;document.getElementById('score-correct').textContent=\`○ \${cc}語\`;document.getElementById('score-wrong').textContent=\`✕ \${wc}語\`;}
document.getElementById('btn-retry').addEventListener('click',()=>{const w=deck.filter(item=>results[item.word]==='wrong');startSession(w.length>0?w:masterVocabulary);});
document.getElementById('btn-reset').addEventListener('click',()=>startSession(masterVocabulary));
startSession(masterVocabulary);
<\/script>
</body>
</html>`;

  const blob = new Blob([src], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'revised_flashcards.html';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

document.addEventListener('keydown', e => {
  if (resultScreen.style.display !== 'none') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!isFlipped) setFlipped(true); }
  if (isFlipped) {
    if (e.key === 'ArrowLeft'  || e.key === 'x' || e.key === 'X') { e.preventDefault(); judge('wrong'); }
    if (e.key === 'ArrowRight' || e.key === 'o' || e.key === 'O') { e.preventDefault(); judge('correct'); }
  }
  if (e.key === 'ArrowUp' || e.key === 'Backspace') { if (!btnBack.disabled) { e.preventDefault(); btnBack.click(); } }
});

startSession(masterVocabulary);
</script>
</body>
</html>
